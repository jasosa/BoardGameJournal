<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept A: Rulebook, Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f5f0;
    --ink: #17171a;
    --soft: #5c5c61;
    --rule: #d9d5cb;
    --spot: #c8402a;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --sans: Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }

  header.top { border-bottom: 1px solid var(--ink); }
  header.top .wrap { height: 64px; display: flex; align-items: center; gap: 40px; }
  .mark { font: 400 28px/1 var(--serif); letter-spacing: -0.01em; }
  nav.main { display: flex; gap: 28px; font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  nav.main a { padding: 6px 0; border-bottom: 2px solid transparent; color: var(--soft); }
  nav.main a[aria-current] { color: var(--ink); border-color: var(--ink); }
  .add { margin-left: auto; font: 500 13px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; background: var(--ink); color: var(--paper); padding: 14px 18px; min-height: 44px; display: inline-flex; align-items: center; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; padding: 28px 0 18px; gap: 24px; }
  h1 { font: 400 64px/0.95 var(--serif); letter-spacing: -0.02em; }
  h1 small { font: 400 13px/1 var(--mono); color: var(--soft); letter-spacing: 0.04em; margin-left: 14px; vertical-align: 6px; text-transform: uppercase; }
  .tools { display: flex; align-items: center; gap: 28px; }
  .search { border-bottom: 1px solid var(--ink); width: 260px; display: flex; align-items: center; min-height: 44px; }
  .search input { border: 0; background: transparent; font: 400 16px var(--sans); color: var(--ink); width: 100%; outline: none; }
  .search input::placeholder { color: var(--soft); }
  .views { display: flex; gap: 18px; font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .views a { padding: 14px 0; color: var(--soft); border-bottom: 2px solid transparent; }
  .views a[aria-current] { color: var(--ink); border-color: var(--ink); }

  .filters { display: flex; align-items: center; gap: 26px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--ink); height: 46px; font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .filters a { color: var(--soft); padding: 15px 0; border-bottom: 2px solid transparent; }
  .filters a b { font-weight: 500; margin-left: 6px; }
  .filters a[aria-current] { color: var(--ink); border-color: var(--ink); }
  .filters .sort { margin-left: auto; color: var(--soft); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--soft); padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); }
  td { padding: 0 12px 0 0; border-bottom: 1px solid var(--rule); height: 54px; vertical-align: middle; font-size: 15px; }
  td.gut, th.gut { width: 64px; }
  td.gut { font: 400 38px/1 var(--serif); color: var(--ink); vertical-align: top; padding-top: 8px; border-bottom-color: transparent; }
  td.no { width: 56px; font: 400 13px var(--mono); color: var(--soft); }
  td.thumb { width: 52px; }
  td.thumb img { width: 30px; height: 40px; object-fit: cover; display: block; outline: 1px solid var(--rule); }
  td.title { font: 400 24px/1.1 var(--serif); letter-spacing: -0.005em; }
  td.title span { font: 400 13px var(--mono); color: var(--soft); margin-left: 10px; letter-spacing: 0.02em; }
  td.num { font: 400 14px var(--mono); color: var(--soft); width: 120px; }
  td.status { width: 170px; font: 400 13px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  td.status.off { color: var(--spot); }
  td.status.off::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--spot); margin-right: 8px; }
  td.plays { width: 64px; font: 400 14px var(--mono); text-align: right; padding-right: 0; }
  tr.row:hover td.title { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  tr.first td { border-top: 1px solid var(--ink); }
  tr.first td.gut { border-top-color: transparent; }
  tr.first:first-of-type td { border-top: 0; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="#">Meeple Journal</a>
    <nav class="main" aria-label="Main">
      <a href="#" aria-current="page">Library</a>
      <a href="#">Journal</a>
      <a href="#">Settings</a>
    </nav>
    <a class="add" href="#">+ Add game</a>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>Library<small>214 games</small></h1>
    <div class="tools">
      <label class="search"><span style="position:absolute;left:-9999px">Search your games</span><input type="search" placeholder="Search your games"></label>
      <nav class="views" aria-label="Library view">
        <a href="#" aria-current="page">Index</a><a href="#">Gallery</a><a href="#">Shelf</a>
      </nav>
    </div>
  </div>

  <div class="filters">
    <a href="#" aria-current="page">All<b>214</b></a>
    <a href="#">Owned<b>168</b></a>
    <a href="#">Wishlist<b>21</b></a>
    <a href="#">Interested<b>14</b></a>
    <a href="#">Previously owned<b>11</b></a>
    <span class="sort">Sort: Title A-Z</span>
  </div>

  <table id="index" aria-label="Your games">
    <thead><tr><th class="gut"></th><th>No.</th><th></th><th>Title</th><th>Players</th><th>Time</th><th>Status</th><th style="text-align:right;padding-right:0">Plays</th></tr></thead>
    <tbody></tbody>
  </table>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/art.js"></script>
<script>
  const games = [...GAMES].sort((a, b) => a.title.localeCompare(b.title));
  const body = document.querySelector("#index tbody");
  let prev = "", n = 0;
  for (const g of games) {
    const letter = g.title[0].toUpperCase();
    n += 4;
    const first = letter !== prev;
    prev = letter;
    const off = g.status !== "owned";
    const tr = document.createElement("tr");
    tr.className = "row" + (first ? " first" : "");
    tr.innerHTML = `
      <td class="gut">${first ? letter : ""}</td>
      <td class="no">${String(n).padStart(3, "0")}</td>
      <td class="thumb"><img alt="" src="${coverArt(g, { ratio: 0.75 })}"></td>
      <td class="title"><a href="#">${g.title}</a><span>${g.year}</span></td>
      <td class="num">${g.players}</td>
      <td class="num">${g.time}</td>
      <td class="status ${off ? "off" : ""}">${STATUS_LABEL[g.status]}</td>
      <td class="plays">${g.plays || ""}</td>`;
    body.appendChild(tr);
  }
</script>
</body>
</html>
